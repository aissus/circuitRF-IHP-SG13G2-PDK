# Builds and validates the kit in the base image on every push and pull request. Every push to main
# also publishes it as the next release, v0.<n>.0, with its tag made on GitHub; nobody tags by hand.
# ci/build-release.sh does the work, the same as locally:
#     ./kit.sh ci/build-release.sh
name: release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run at a time on main, so two quick pushes cannot claim the same version.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kit:
    runs-on: ubuntu-latest
    # A hung MPI run would otherwise hold the runner for six hours.
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # with the tags, to number the release

      # The next release on main: one past the highest v0.<n>.0 tag (v0.1.0 for the first).
      - name: Next version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          n=$(git tag -l 'v0.*.0' | sed -n 's/^v0\.\([0-9]*\)\.0$/\1/p' | sort -n | tail -1)
          echo "KIT_VERSION=v0.$(( ${n:-0} + 1 )).0" >> "$GITHUB_ENV"

      # The base image is many GB; the runner's preinstalled toolchains are not needed.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af
          df -h

      # The image kit.def builds on. Its entrypoint starts a desktop unless given --skip; either way it
      # first gives the uid a user name (OpenMPI, under Xyce, asks for one) and sources the tools'
      # profile. The uid is the checkout's owner, so the build can write there and git trusts the repo.
      - name: Build and validate the kit
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo -e KIT_VERSION \
            "$(awk '$1 == "From:" {print $2}' kit.def)" --skip ci/build-release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: kit
          path: |
            dist/
            kit/IHP_SG13G2/VALIDATION
          if-no-files-found: error

      - name: Publish the release
        if: env.KIT_VERSION != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=$RUNNER_TEMP/notes.md
          cat > "$f" <<EOF
          The IHP SG13G2 device kit for circuitRF, with an example workspace and the files AI coding agents
          use (\`CLAUDE.md\`, a skill, \`.mcp.json\` for circuitRF's MCP server). Built from the IHP Open PDK
          and validated against the PDK's own models in ngspice and Xyce. The \`.sha256\` checks the archive.

          Requires **circuitRF 1.7.5 or newer**, and **OpenVAF** once, to compile the VBIC models.

          $(sed 's/^/    /' kit/IHP_SG13G2/BUILD)

          **Use.** Unpack the zip anywhere, then:

              generator/build-vbic.sh                       # once: the HBTs' VBIC models, with OpenVAF
              circuitrf examples/.cws                       # the example workspace
              generator/circuitrf-ihp-workspace my_project  # a workspace of your own

          **License.** Apache-2.0, as the IHP Open PDK; see LICENSE and NOTICE. The VBIC models are not
          distributed: \`generator/build-vbic.sh\` compiles them from VBIC 1.3's public Verilog-A source.
          EOF
          gh release create "$KIT_VERSION" dist/* --target "$GITHUB_SHA" \
            --title "IHP SG13G2 kit for circuitRF $KIT_VERSION" --notes-file "$f"
